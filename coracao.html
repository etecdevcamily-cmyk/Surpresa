<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu coração é seu 💜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #040207;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      padding: 20px;
    }

    /* Container com a borda branca animada */
    .moldura-animada {
      position: relative;
      width: 100%;
      height: calc(100vh - 40px);
      max-width: 1200px;
      border-radius: 28px;
      padding: 3px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.18), 0 0 80px rgba(168, 85, 247, 0.25);
    }

    /* Luz giratória branca que cria o efeito de traço correndo na borda */
    .moldura-animada::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent,
        rgba(255, 255, 255, 0.1) 15%,
        #ffffff 25%,
        rgba(255, 255, 255, 0.2) 35%,
        transparent 50%,
        rgba(255, 255, 255, 0.1) 65%,
        #ffffff 75%,
        rgba(255, 255, 255, 0.2) 85%,
        transparent 100%
      );
      animation: girarBorda 5s linear infinite;
    }

    /* Segunda camada de brilho pulsante */
    .moldura-animada::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 3;
      animation: pulsarBorda 2s ease-in-out infinite alternate;
    }

    @keyframes girarBorda {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulsarBorda {
      0% {
        box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
      }
      100% {
        box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.45);
        border-color: rgba(255, 255, 255, 0.85);
      }
    }

    /* Interior escuro onde o coração e o canvas rodam */
    .conteudo-interior {
      position: relative;
      width: 100%;
      height: 100%;
      background: #040207;
      border-radius: 25px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Texto centralizado perfeitamente dentro do coração */
    .conteudo-centro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%) scale(0.92);
      z-index: 2;
      text-align: center;
      width: min(90%, 340px);
      pointer-events: none;
      opacity: 0;
      /* Entrada rápida do texto */
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }

    .conteudo-centro.visivel {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .conteudo-centro h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      color: #f3e8ff;
      text-shadow: 0 0 20px rgba(148, 48, 247, 0.9), 0 0 40px rgba(118, 0, 228, 0.7);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .conteudo-centro p {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: #e9d5ff;
      line-height: 1.45;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Estrutura da borda animada -->
  <div class="moldura-animada">
    <div class="conteudo-interior" id="areaInterna">
      <canvas id="canvas"></canvas>

      <div class="conteudo-centro" id="textoCentro">
        <h1>Eu sabia! 💜</h1>
        <p>O meu coração bate muito mais feliz por você.</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const textoCentro = document.getElementById('textoCentro');
    const areaInterna = document.getElementById('areaInterna');

    let largura, altura;
    function redimensionar() {
      largura = canvas.width = areaInterna.clientWidth;
      altura = canvas.height = areaInterna.clientHeight;
    }
    redimensionar();
    window.addEventListener('resize', redimensionar);

    function bordaCoracao(t, escala) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * escala, y: y * escala };
    }

    const totalParticulas = 1400;
    const particulas = [];
    const paleta = [
      '#c084fc',
      '#a855f7',
      '#9333ea',
      '#e9d5ff',
      '#f3e8ff',
      '#7e22ce',
      '#d8b4fe'
    ];

    for (let i = 0; i < totalParticulas; i++) {
      const t = Math.PI * 2 * (i / totalParticulas);
      const ehBorda = Math.random() > 0.35;
      const fatorPreenchimento = ehBorda ? 1 : Math.sqrt(Math.random()) * 0.92;

      particulas.push({
        t: t,
        fator: fatorPreenchimento,
        x: (Math.random() - 0.5) * window.innerWidth * 2 + window.innerWidth / 2,
        y: (Math.random() - 0.5) * window.innerHeight * 2 + window.innerHeight / 2,
        raio: Math.random() * 1.8 + 1.2,
        cor: paleta[Math.floor(Math.random() * paleta.length)],
        dispersaoX: (Math.random() - 0.5) * 6,
        dispersaoY: (Math.random() - 0.5) * 6,
        brilho: Math.random() * 12 + 6
      });
    }

    let tempo = 0;
    let animacaoCompleta = false;

    function animar() {
      ctx.fillStyle = 'rgba(4, 2, 7, 0.28)';
      ctx.fillRect(0, 0, largura, altura);

      tempo += 0.045; // Relógio acelerado
      const centroX = largura / 2;
      const centroY = altura / 2 - 15;

      const escalaBase = Math.min(largura, altura) / 32;
      // Começa o batimento bem antes
      const pulso = tempo > 0.8 ? Math.sin(tempo * 4.2) * 1.1 : 0;
      const escalaAtual = escalaBase + pulso;

      for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        const pontoBorda = bordaCoracao(p.t, escalaAtual);

        const alvoX = centroX + (pontoBorda.x * p.fator) + p.dispersaoX;
        const alvoY = centroY + (pontoBorda.y * p.fator) + p.dispersaoY;

        // Atração acelerada (0.14) para formar a figura num piscar de olhos
        p.x += (alvoX - p.x) * 0.14;
        p.y += (alvoY - p.y) * 0.14;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
        ctx.fillStyle = p.cor;
        ctx.shadowBlur = p.brilho;
        ctx.shadowColor = p.cor;
        ctx.fill();
      }

      // O texto aparece aos ~0.7 segundos
      if (tempo > 0.7 && !animacaoCompleta) {
        animacaoCompleta = true;
        textoCentro.classList.add('visivel');
      }

      requestAnimationFrame(animar);
    }

    animar();
  </script>
</body>
</html>
