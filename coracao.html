<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu coração é seu 💜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .mensagem {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 360px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.4s ease, transform 1.4s ease;
      pointer-events: none;
      padding: 0 20px;
    }

    .mensagem.visivel {
      opacity: 1;
      transform: translateY(0);
    }

    .mensagem h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      color: #c084fc;
      text-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
      margin-bottom: 8px;
    }

    .mensagem p {
      font-size: 1.15rem;
      color: #e9d5ff;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="mensagem" id="mensagem">
    <h1>Eu sabia! 💜</h1>
    <p>O meu coração bate muito mais feliz por você.</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const mensagem = document.getElementById('mensagem');

    let largura, altura;
    function redimensionar() {
      largura = canvas.width = window.innerWidth;
      altura = canvas.height = window.innerHeight;
    }
    redimensionar();
    window.addEventListener('resize', redimensionar);

    // Fórmula paramétrica do coração
    function posicaoCoracao(t, escala) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * escala, y: y * escala };
    }

    const totalParticulas = 480;
    const particulas = [];
    const cores = ['#a855f7', '#c084fc', '#d8b4fe', '#9333ea', '#e9d5ff'];

    for (let i = 0; i < totalParticulas; i++) {
      const t = Math.PI * 2 * (i / totalParticulas);
      particulas.push({
        t: t,
        // Posição inicial espalhada aleatória
        x: (Math.random() - 0.5) * window.innerWidth * 1.5 + window.innerWidth / 2,
        y: (Math.random() - 0.5) * window.innerHeight * 1.5 + window.innerHeight / 2,
        vx: 0,
        vy: 0,
        raio: Math.random() * 2 + 1.6,
        cor: cores[Math.floor(Math.random() * cores.length)],
        dispersao: (Math.random() - 0.5) * 8
      });
    }

    let tempo = 0;
    const centroY_offset = -40; // sobe o coração para dar espaço ao texto

    function animar() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, largura, altura);

      tempo += 0.03;
      const centroX = largura / 2;
      const centroY = altura / 2 + centroY_offset;

      // Escala com pulso suave após formar o formato
      const fatorEscala = Math.min(largura, altura) / 36;
      const pulso = tempo > 3 ? Math.sin(tempo * 4) * 0.8 : 0;
      const escalaAtual = fatorEscala + pulso;

      particulas.forEach((p) => {
        const alvo = posicaoCoracao(p.t, escalaAtual);
        const alvoX = centroX + alvo.x + p.dispersao;
        const alvoY = centroY + alvo.y + p.dispersao;

        // Movimento suave das partículas em direção ao coração
        p.x += (alvoX - p.x) * 0.045;
        p.y += (alvoY - p.y) * 0.045;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
        ctx.fillStyle = p.cor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.cor;
        ctx.fill();
      });

      // Revela o texto assim que o formato estiver pronto
      if (tempo > 2.5) {
        mensagem.classList.add('visivel');
      }

      requestAnimationFrame(animar);
    }

    animar();
  </script>
</body>
</html>
