<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu coração é seu 💜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #040207;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Texto centralizado perfeitamente dentro do coração */
    .conteudo-centro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      width: min(90%, 340px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1), transform 2.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translate(-50%, -46%) scale(0.92);
    }

    .conteudo-centro.visivel {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .conteudo-centro h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      color: #f3e8ff;
      text-shadow: 0 0 20px rgba(148, 48, 247, 0.9), 0 0 40px rgba(118, 0, 228, 0.7);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .conteudo-centro p {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: #e9d5ff;
      line-height: 1.45;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="conteudo-centro" id="textoCentro">
    <h1>Eu sabia! 💜</h1>
    <p>O meu coração bate muito mais feliz por você.</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const textoCentro = document.getElementById('textoCentro');

    let largura, altura;
    function redimensionar() {
      largura = canvas.width = window.innerWidth;
      altura = canvas.height = window.innerHeight;
    }
    redimensionar();
    window.addEventListener('resize', redimensionar);

    // Equação paramétrica do contorno do coração
    function bordaCoracao(t, escala) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * escala, y: y * escala };
    }

    const totalParticulas = 1400;
    const particulas = [];
    const paleta = [
      '#c084fc',
      '#a855f7',
      '#9333ea',
      '#e9d5ff',
      '#f3e8ff',
      '#7e22ce',
      '#d8b4fe'
    ];

    for (let i = 0; i < totalParticulas; i++) {
      const t = Math.PI * 2 * (i / totalParticulas);
      
      // Cerca de 65% na borda e 35% no preenchimento interno para dar densidade
      const ehBorda = Math.random() > 0.35;
      const fatorPreenchimento = ehBorda ? 1 : Math.sqrt(Math.random()) * 0.92;

      particulas.push({
        t: t,
        fator: fatorPreenchimento,
        // Posição inicial bem dispersa e distante
        x: (Math.random() - 0.5) * window.innerWidth * 2 + window.innerWidth / 2,
        y: (Math.random() - 0.5) * window.innerHeight * 2 + window.innerHeight / 2,
        raio: Math.random() * 1.8 + 1.2,
        cor: paleta[Math.floor(Math.random() * paleta.length)],
        dispersaoX: (Math.random() - 0.5) * 6,
        dispersaoY: (Math.random() - 0.5) * 6,
        brilho: Math.random() * 12 + 6
      });
    }

    let tempo = 0;
    let animacaoCompleta = false;

    function animar() {
      // Rastro suave
      ctx.fillStyle = 'rgba(4, 2, 7, 0.25)';
      ctx.fillRect(0, 0, largura, altura);

      tempo += 0.016; // Avanço de tempo mais lento
      const centroX = largura / 2;
      const centroY = altura / 2 - 15; // Leve ajuste no centro do coração

      // Escala responsiva proporcional à tela
      const escalaBase = Math.min(largura, altura) / 32;
      // Pulso suave que só começa após o formato se consolidar
      const pulso = tempo > 4.5 ? Math.sin(tempo * 2.8) * 0.9 : 0;
      const escalaAtual = escalaBase + pulso;

      for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        const pontoBorda = bordaCoracao(p.t, escalaAtual);

        const alvoX = centroX + (pontoBorda.x * p.fator) + p.dispersaoX;
        const alvoY = centroY + (pontoBorda.y * p.fator) + p.dispersaoY;

        // Convergência mais lenta e suave (fator 0.018 ao invés de 0.045)
        p.x += (alvoX - p.x) * 0.012;
        p.y += (alvoY - p.y) * 0.012;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
        ctx.fillStyle = p.cor;
        ctx.shadowBlur = p.brilho;
        ctx.shadowColor = p.cor;
        ctx.fill();
      }

      // Mostra o texto quando as partículas já estiverem bem próximas do coração
      if (tempo > 4.0 && !animacaoCompleta) {
        animacaoCompleta = true;
        textoCentro.classList.add('visivel');
      }

      requestAnimationFrame(animar);
    }

    animar();
  </script>
</body>
</html>
